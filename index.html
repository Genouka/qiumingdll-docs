<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, minimum-scale=1.0, shrink-to-fit=no, viewport-fit=cover">

  <title>QiumingDLL API Documentation</title>
  <meta name="description" content="API documentation for QiumingDLL - a Windows extension library for game development.">

  <!-- Core Theme (see https://docsify.js.org/#/themes) -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css">

  <!-- Language switch -->
  <style>
    .qm-lang-switch {
      position: fixed;
      top: 0;
      right: 0;
      z-index: 40;
      padding: 0.55em 0.9em;
      font-size: 14px;
      line-height: 1;
      color: var(--theme-color, #42b983);
      background: var(--base-background-color, #fff);
      border: 1px solid var(--border-color, #e5e5e5);
      border-top: 0;
      border-right: 0;
      border-bottom-left-radius: 6px;
      text-decoration: none;
      opacity: 0.9;
    }

    .qm-lang-switch:hover {
      opacity: 1;
      text-decoration: underline;
    }
  </style>

</head>

<body>
  <div id="app"></div>
  <a class="qm-lang-switch" href="en/" data-native-link>English</a>

  <script>
    // Keep docsify from turning the language switch into an in-app route.
    document.addEventListener('click', function (event) {
      var link = event.target && event.target.closest ? event.target.closest('a[data-native-link]') : null;
      if (link) {
        event.stopPropagation();
      }
    }, true);
  </script>
  <script>
    // Docsify Configuration (see https://docsify.js.org/#/configuration)
    window.$docsify = {
      name: 'QiumingDLL 文档',
      relativePath: true,
      notFoundPage: true,
      // Sidebar Configuration
      auto2top: true,
      loadSidebar: true,
      maxLevel: 0,
      // Set subMaxLevel to 0 to remove automatic display of page table of contents (TOC) in Sidebar
      subMaxLevel: 0,

      // Search Plugin Configuration
      search: {
        placeholder: '搜索...',
        noData: '无匹配项目',
        // Headline depth, 1 - 6
        depth: 6,
      }
    };
  </script>

  <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/plugins/zoom-image.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/plugins/search.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script>
    if (typeof navigator.serviceWorker !== 'undefined') {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
  <script defer src="https://status.genouka.top/script.js" data-website-id="eb48a243-9c7f-4be4-b677-958cea541922"></script>
</body>
</html>
